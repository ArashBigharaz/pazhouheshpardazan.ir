<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد مدیریتی و تحلیلی</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- افزودن کد اینماد در بخش هدر -->
    <meta name="enamad" content="77554240">
    <style>
        .back-to-top { position: fixed; bottom: 20px; right: 20px; display: none; background: #3b82f6; color: white; padding: 10px 15px; border-radius: 50%; cursor: pointer; transition: 0.3s; }
        .pulse-card { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <!-- Sticky Header -->
    <header class="fixed top-0 w-full z-50 backdrop-blur-md bg-white/80 border-b border-gray-200">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold">سامانه تحلیلی</h1>
            <ul class="flex gap-6">
                <li><a href="#" class="hover:text-blue-600">خانه</a></li>
                <li><a href="#" class="hover:text-blue-600">خدمات</a></li>
            </ul>
        </nav>
    </header>

    <main class="pt-24 container mx-auto px-6 pb-20">
        <!-- داشبورد جدید -->
        <section class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-2xl font-bold mb-6">تحلیل عملکرد</h2>
            <div class="flex items-end gap-4 h-64 bg-gray-50 p-6 rounded-lg">
                <div class="w-16 bg-blue-500 rounded-t h-[86%] transition-all hover:bg-blue-600"></div>
                <div class="w-16 bg-blue-400 rounded-t h-[60%] transition-all hover:bg-blue-500"></div>
                <div class="w-16 bg-blue-300 rounded-t h-[75%] transition-all hover:bg-blue-400"></div>
            </div>
            
            <!-- کارت سرعت -->
            <div class="mt-8 p-4 bg-green-100 text-green-800 rounded-xl pulse-card font-bold text-center">
                🚀 سرعت بالای اجرا: تأیید شد
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-300 py-12">
        <div class="container mx-auto px-6 grid grid-cols-1 md:grid-cols-3 gap-12">
            <div>
                <h3 class="text-white font-bold mb-4">خدمات</h3>
                <ul class="space-y-2">
                    <li><a href="#">تحلیل آماری</a></li>
                    <li><a href="#">هوش تجاری</a></li>
                </ul>
            </div>
            
            <!-- جایگاه اینماد -->
            <div class="text-center">
                <h3 class="text-white font-bold mb-4">مجوزها</h3>
                <div class="bg-white p-2 rounded-lg inline-block">
                    <img src="https://trustseal.enamad.ir/logo.aspx?id=77554240" alt="اینماد" style="cursor:pointer" onclick="window.open('https://trustseal.enamad.ir/?id=77554240','popup','toolbar=no,scrollbars=no,location=no,statusbar=no,menubar=no,resizable=0,width=700,height=600');">
                </div>
            </div>

            <div>
                <h3 class="text-white font-bold mb-4">ارتباط</h3>
                <p>توسعه یافته توسط تیم فنی.</p>
            </div>
        </div>
    </footer>

</body>
</html>
